# Defaults only. Every key can be overridden by an environment variable:
# replace '.' with '_' and upper-case it, e.g. jdbc.password -> JDBC_PASSWORD.
# Never commit real credentials here - inject them from a Kubernetes Secret.

#JDBC Configuration for Database Connection
jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://devopsdb:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false
jdbc.username=vprofile
jdbc.password=

#Memcached (optional). Leave the host empty to disable caching.
#Active Host
memcached.active.host=
memcached.active.port=11211
#StandBy Host
memcached.standBy.host=
memcached.standBy.port=11211

#RabbitMq Configuration
rabbitmq.address=vpromq01
rabbitmq.port=15672
rabbitmq.username=guest
rabbitmq.password=guest

#Elasticesearch Configuration
elasticsearch.host =vprosearch01
elasticsearch.port =9300
elasticsearch.cluster=vprofile
elasticsearch.node=vprofilenode
