apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-app
  namespace: vprofile
  labels: {app: vprofile-app}
spec:
  replicas: 3                        # HPA manages this after the first apply
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0              # zero-downtime rollouts
  selector:
    matchLabels: {app: vprofile-app}
  template:
    metadata:
      labels: {app: vprofile-app}
    spec:
      terminationGracePeriodSeconds: 60
      # One pod per AZ (hard rule), and spread across nodes (soft rule)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: vprofile-app}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: vprofile-app}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Don't start Tomcat until MySQL answers on 3306
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 3 devopsdb 3306; do echo waiting for devopsdb; sleep 3; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: app
          image: shaikmustafa/king:app   # <-- change to your image
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: JDBC_URL
              valueFrom: {configMapKeyRef: {name: vprofile-config, key: JDBC_URL}}
            - name: JDBC_USERNAME
              valueFrom: {secretKeyRef: {name: vprofile-db, key: JDBC_USERNAME}}
            - name: JDBC_PASSWORD
              valueFrom: {secretKeyRef: {name: vprofile-db, key: JDBC_PASSWORD}}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1Gi}
          # /health is public, session-less and DB-independent.
          # Spring + Hibernate boot is slow: allow up to ~3 minutes
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # let the ALB deregister the pod before Tomcat stops
              exec: {command: ["sleep", "20"]}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
