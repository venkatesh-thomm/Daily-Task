# TEMPLATE - replace the CHANGE_ME values locally before applying,
# and NEVER commit real values (base64 in a Secret is encoding, not encryption).
#   Generate random values:  openssl rand -base64 24
#
# MySQL reads these only on its FIRST start (empty volume). Changing them later
# does not change the passwords inside the database.
apiVersion: v1
kind: Secret
metadata:
  name: vprofile-db
  namespace: vprofile
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_ROOT"
  JDBC_USERNAME: "vprofile"          # app user (least privilege, not root)
  JDBC_PASSWORD: "CHANGE_ME_APP"
